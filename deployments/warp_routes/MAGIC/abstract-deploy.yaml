# Ronin (domain 2020) was intentionally removed from this route (#1641) after
# Hyperlane's Ronin support was sunset and Treasure asked to close the bridge,
# so it is not a leg here or in abstract-config.yaml (and not exposed in UIs).
# Ronin is still enrolled on-chain on the abstract, arbitrum and base routers
# until each owner executes `unenrollRemoteRouter(2020)`. We do not control
# these routers, so the 2020 entries in remoteRouters/destinationGas below
# temporarily mirror that enrollment to keep `warp check` from alerting on it.
#
# TEMPORARY: once the owners unenroll ronin and the checker reports the change
# (domain 2020 no longer enrolled on-chain), remove every 2020 entry below. An
# explicit remoteRouters/destinationGas replaces the computed one entirely, so
# every remote must be listed, not just ronin.
#
# The abstract and base legs are custom MagicBridge contracts (not stock
# Hyperlane routers) that report PACKAGE_VERSION 8.0.0 but have no `scale()`
# getter, so the SDK derives their scale from bytecode, not from the version.
abstract:
  destinationGas:
    "2020": "70000"
    "8453": "70000"
    "42161": "70000"
  gas: 70000
  interchainSecurityModule: "0xb82A1AC8516610FB139DBee6Cc92841E9f8518b2"
  owner: "0xe8f5EEFae4e22556050e3b7058FB035449C3a954"

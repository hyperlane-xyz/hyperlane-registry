# Reject packages published less than 7 days ago (supply chain protection)
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@hyperlane-xyz/*"
  - "@oxfmt/*"
  - "@oxlint/*"
  - oxfmt
  - oxlint
  - zod@4.5.4
allowBuilds:
  bigint-buffer: true
  bufferutil: true
  core-js: true
  esbuild: true
  protobufjs: true
  secp256k1: true
  utf-8-validate: true
